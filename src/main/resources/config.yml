# Ресурспак с графикой меню плагин раздаёт сам через встроенный веб-сервер.
pack:
  # Порт веб-сервера ресурспака (на хостинге его нужно открыть).
  port: 8165
  # Адрес, по которому игроки скачивают пак. На хостинге: http://<IP-сервера>:<порт>/pack.zip
  public-url: "http://localhost:8165/pack.zip"
  # Кикать, если игрок отказался от ресурспака.
  required: false
